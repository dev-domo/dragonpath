services:
  - type: web
    name: dragonpath
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit # "off" turned out to also block deploys triggered by the sync hook, not just git-push — see README
    envVars:
      - key: UPSTAGE_API_KEY
        sync: false # set manually in the Render dashboard — do not commit real keys
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"
